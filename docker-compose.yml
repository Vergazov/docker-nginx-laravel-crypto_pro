services:

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - network

  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./src:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - network

  redis:
      image: redis:7-alpine
      ports:
          - '6379:6379'
      volumes:
          - redis-data:/data
      networks:
          - network
      restart: unless-stopped

  
